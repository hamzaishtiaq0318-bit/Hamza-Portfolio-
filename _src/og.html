<!doctype html>
<!-- Source for /assets/images/og-preview.png (the link-preview image). Render at 1200x630. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/assets/css/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .og { position: relative; width: 1200px; height: 630px; background: #fff; overflow: hidden; }
  .og .hero__grid-bg { opacity: .7; }
  .og__glow { position: absolute; right: -120px; bottom: -260px; width: 820px; height: 820px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(116,48,247,.14), rgba(116,48,247,.04) 55%, transparent 72%); }
  .og__text { position: absolute; left: 72px; top: 70px; width: 640px; display: flex; flex-direction: column; gap: 26px; }
  .og__brand { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 500; letter-spacing: -0.045em; }
  .og h1 { font-size: 60px; font-weight: 500; line-height: 1.04; letter-spacing: -0.05em; }
  .og p { font-size: 22px; line-height: 1.45; color: var(--muted); letter-spacing: -0.025em; max-width: 560px; }
  .og__logos { display: flex; gap: 12px; margin-top: 6px; }
  .og__logos span { display: inline-flex; align-items: center; gap: 9px; height: 44px; padding: 0 16px 0 10px; border-radius: 14px; background: #f5f5f6; font-size: 17px; font-weight: 500; letter-spacing: -0.03em; }
  .og__logos img { width: 24px; height: 24px; object-fit: contain; }
  .og__logos img.wide { width: 34px; }
  .og__photo { position: absolute; right: 30px; bottom: 0; width: 470px;
    -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent 99%); mask-image: linear-gradient(to bottom, #000 70%, transparent 99%); }
  .og__pill { position: absolute; right: 330px; top: 70px; }
  .og__domain { position: absolute; left: 72px; bottom: 44px; font-size: 18px; color: var(--muted); letter-spacing: -0.02em; }
</style>
</head>
<body>
<div class="og">
  <div class="hero__grid-bg"></div>
  <div class="og__glow"></div>
  <img class="og__photo" src="/assets/images/hamza-hero.webp" alt="">
  <div class="og__text">
    <div class="og__brand">Hamza Ishtiaq</div>
    <h1><span class="tone">Full-stack web developer.</span> I build websites that help your business grow.</h1>
    <p>Custom websites &amp; web apps, Shopify stores, and WordPress &amp; Wix theme upgrades.</p>
    <div class="og__logos">
      <span><img src="/assets/images/logos/shopify.svg" alt="">Shopify</span>
      <span><img src="/assets/images/logos/wordpress-icon.svg" alt="">WordPress</span>
      <span><img class="wide" src="/assets/images/logos/wix.svg" alt=""></span>
      <span><img src="/assets/images/logos/react.svg" alt="">React</span>
    </div>
  </div>
  <div class="og__domain">hamzaportfolio.dev</div>
</div>
</body>
</html>
